  <!-- counts -->
  <rect x="620" y="700" width="450" height="60" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="845" y="740" text-anchor="middle" font-size="26" font-weight="700" fill="#1b5e20">17 of 21 are named primitives</text>
  <rect x="1090" y="700" width="600" height="60" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="1390" y="740" text-anchor="middle" font-size="26" font-weight="700" fill="#8e0000">6 of 28 — and 12 are hard absences</text>

  <!-- the takeaway -->
  <rect x="90" y="806" width="1740" height="176" rx="12" fill="#fffdf3" stroke="#f9a825" stroke-width="3"/>
  <text x="130" y="862" font-size="32" font-weight="700" fill="#111">The rows that make a harness a team thing are shipped by personal assistants.</text>
  <text x="130" y="910" font-size="32" font-weight="700" fill="#111">The coding harnesses refuse them — on the record.</text>
  <text x="130" y="956" font-size="24" fill="#555" font-style="italic">Pi ships a published refusal list. OpenCode has no memory, no cadence, no rituals, and no non-goals section to explain why.</text>

  <text x="90" y="1030" font-size="19" fill="#999">Grok column reads the Bot half. Codex and Claude Code are the two coding harnesses reaching upward — and neither reaches 10b. Source: components/ALIGNMENT.md §2, §3.1.</text>
</svg>
