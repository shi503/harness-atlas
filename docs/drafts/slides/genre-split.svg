    <text x="690" y="486" text-anchor="middle" fill="#2e7d32" font-size="34">●</text>
    <text x="845" y="486" text-anchor="middle" fill="#2e7d32" font-size="34">●</text>
    <text x="1000" y="486" text-anchor="middle" fill="#2e7d32" font-size="34">●</text>
