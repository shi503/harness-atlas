    <text x="1290" y="486" text-anchor="middle" fill="#c62828" font-size="34">○</text>
    <text x="1430" y="486" text-anchor="middle" fill="#c62828" font-size="34">○</text>
    <text x="1600" y="486" text-anchor="middle" fill="#2e7d32" font-size="34">●</text>

    <text x="580" y="542" text-anchor="end" font-size="25" fill="#111" font-weight="600">10a  Roster</text>
    <text x="690" y="544" text-anchor="middle" fill="#2e7d32" font-size="34">●</text>
    <text x="845" y="544" text-anchor="middle" fill="#2e7d32" font-size="34">●</text>
    <text x="1000" y="544" text-anchor="middle" fill="#2e7d32" font-size="34">●</text>
    <text x="1160" y="544" text-anchor="middle" fill="#c62828" font-size="34">○</text>
    <text x="1290" y="544" text-anchor="middle" fill="#a08000" font-size="34">◐</text>
