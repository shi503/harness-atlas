<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Inter, Helvetica Neue, Arial, sans-serif">
  <rect width="1920" height="1080" fill="#ffffff"/>

  <text x="90" y="86" font-size="44" font-weight="700" fill="#111">Where convergence stops</text>
  <text x="90" y="128" font-size="25" fill="#666">33 components, 7 harnesses, each read at its own source</text>

  <!-- legend -->
  <rect x="1290" y="62" width="22" height="22" rx="4" fill="#2e7d32"/>
  <text x="1322" y="80" font-size="21" fill="#333">named primitive in all 7</text>
  <rect x="1290" y="96" width="22" height="22" rx="4" fill="#c9ccd1"/>
  <text x="1322" y="114" font-size="21" fill="#333">some ship it</text>
  <rect x="1290" y="130" width="22" height="22" rx="4" fill="#c62828"/>
  <text x="1322" y="148" font-size="21" fill="#333">not one of the 7</text>

  <g font-size="25" fill="#111">
    <!-- ROWS: x=330 start, width 940, height 46, gap 12 -->

    <!-- 11 Surfaces : 1 comp -> 0/1/0 -->
    <text x="300" y="215" text-anchor="end" font-weight="600">11 Surfaces</text>
    <rect x="330" y="190" width="940" height="34" rx="5" fill="#c9ccd1"/>
    <text x="1300" y="215" font-size="22" fill="#666">11a at 6 of 7 — the one converged row up here</text>

    <!-- 10 Teams : 2 -> 0/2/0 -->
    <text x="300" y="263" text-anchor="end" font-weight="600">10 Teams &amp; Agents</text>
    <rect x="330" y="238" width="940" height="34" rx="5" fill="#c9ccd1"/>
    <text x="1300" y="263" font-size="22" fill="#666">roster 3 of 7 · org 2 of 7</text>

    <!-- 9 Improve : 6 -> 0/2/4 -->
    <text x="300" y="311" text-anchor="end" font-weight="600">9 Improve</text>
    <rect x="330" y="286" width="313" height="34" rx="5" fill="#c9ccd1"/>
    <rect x="649" y="286" width="621" height="34" rx="5" fill="#c62828"/>
    <text x="1300" y="311" font-size="22" fill="#8e0000" font-weight="600">rituals · lifecycle · raise-the-floor · diagnose — all 0 of 7</text>

    <!-- 8 Trust : 4 -> 0/3/1 -->
    <text x="300" y="359" text-anchor="end" font-weight="600">8 Trust</text>
    <rect x="330" y="334" width="699" height="34" rx="5" fill="#c9ccd1"/>
    <rect x="1035" y="334" width="235" height="34" rx="5" fill="#c62828"/>
    <text x="1300" y="359" font-size="22" fill="#8e0000" font-weight="600">evals — 0 of 7</text>

    <!-- 7 Workflow : 1 -> 0/1/0 -->
    <text x="300" y="407" text-anchor="end" font-weight="600">7 Workflow Tasks</text>
    <rect x="330" y="382" width="940" height="34" rx="5" fill="#c9ccd1"/>
    <text x="1300" y="407" font-size="22" fill="#666">1 of 7 — one kanban, six half-answers</text>

    <!-- 6 Workspaces : 4 -> 0/2/2 -->
    <text x="300" y="455" text-anchor="end" font-weight="600">6 Workspaces</text>
    <rect x="330" y="430" width="464" height="34" rx="5" fill="#c9ccd1"/>
    <rect x="800" y="430" width="470" height="34" rx="5" fill="#c62828"/>
    <text x="1300" y="455" font-size="22" fill="#8e0000" font-weight="600">product · estate — 0 of 7</text>

    <!-- 5 Context : 3 -> 0/2/1 -->
    <text x="300" y="503" text-anchor="end" font-weight="600">5 Context</text>
    <rect x="330" y="478" width="620" height="34" rx="5" fill="#c9ccd1"/>
    <rect x="956" y="478" width="314" height="34" rx="5" fill="#c62828"/>
    <text x="1300" y="503" font-size="22" fill="#8e0000" font-weight="600">team memory — 0 of 7</text>
  </g>

  <!-- THE LINE -->
  <line x1="90" y1="551" x2="1830" y2="551" stroke="#f9a825" stroke-width="5" stroke-dasharray="14 8"/>
  <rect x="640" y="527" width="640" height="48" rx="24" fill="#fff8e1" stroke="#f9a825" stroke-width="3"/>
  <text x="960" y="559" text-anchor="middle" font-size="25" font-weight="700" fill="#7f4f00">nothing above this line is settled</text>

  <g font-size="25" fill="#111">
    <!-- 4 Capabilities : 2 -> 1/1/0 -->
    <text x="300" y="628" text-anchor="end" font-weight="600">4 Capabilities</text>
    <rect x="330" y="603" width="470" height="34" rx="5" fill="#2e7d32"/>
    <rect x="806" y="603" width="464" height="34" rx="5" fill="#c9ccd1"/>
    <text x="1300" y="628" font-size="22" fill="#1b5e20" font-weight="600">skills — 7 of 7</text>

    <!-- 3 System Stacks : 5 -> 1/3/1 -->
    <text x="300" y="676" text-anchor="end" font-weight="600">3 System Stacks</text>
    <rect x="330" y="651" width="182" height="34" rx="5" fill="#2e7d32"/>
    <rect x="518" y="651" width="562" height="34" rx="5" fill="#c9ccd1"/>
    <rect x="1086" y="651" width="184" height="34" rx="5" fill="#c62828"/>
    <text x="1300" y="676" font-size="22" fill="#333">configuration 7 of 7 · <tspan fill="#8e0000" font-weight="600">standards 0 of 7</tspan></text>

    <!-- 2 Agent Harness : 3 -> 2/1/0 -->
    <text x="300" y="724" text-anchor="end" font-weight="600">2 Agent Harness</text>
    <rect x="330" y="699" width="620" height="34" rx="5" fill="#2e7d32"/>
    <rect x="956" y="699" width="314" height="34" rx="5" fill="#c9ccd1"/>
    <text x="1300" y="724" font-size="22" fill="#1b5e20" font-weight="600">adapters, hooks — 7 of 7</text>

    <!-- 1 Environment : 1 -> 0/0/1 -->
    <text x="300" y="772" text-anchor="end" font-weight="600">1 Environment</text>
    <rect x="330" y="747" width="940" height="34" rx="5" fill="#c62828"/>
    <text x="1300" y="772" font-size="22" fill="#8e0000" font-weight="600">0 of 7 — the only empty row down here</text>

    <!-- 0 Foundation : 1 -> 1/0/0 -->
    <text x="300" y="820" text-anchor="end" font-weight="600">0 Foundation</text>
    <rect x="330" y="795" width="940" height="34" rx="5" fill="#2e7d32"/>
    <text x="1300" y="820" font-size="22" fill="#1b5e20" font-weight="600">substrate — 7 of 7</text>
  </g>

  <!-- summary band -->
  <rect x="90" y="884" width="850" height="122" rx="10" fill="#f3f7f3" stroke="#2e7d32" stroke-width="2"/>
  <text x="120" y="932" font-size="27" font-weight="700" fill="#1b5e20">BELOW · layers 0–4 · 12 components</text>
  <text x="120" y="976" font-size="24" fill="#333"><tspan font-weight="700" font-size="30">5</tspan> shipped by all seven   ·   <tspan font-weight="700" font-size="30">2</tspan> shipped by none</text>

  <rect x="980" y="884" width="850" height="122" rx="10" fill="#fdf4f3" stroke="#c62828" stroke-width="2"/>
  <text x="1010" y="932" font-size="27" font-weight="700" fill="#8e0000">ABOVE · layers 5–11 · 21 components</text>
  <text x="1010" y="976" font-size="24" fill="#333"><tspan font-weight="700" font-size="30">0</tspan> shipped by all seven   ·   <tspan font-weight="700" font-size="30">8</tspan> shipped by none</text>

  <text x="90" y="1046" font-size="19" fill="#999">Hermes · Pi · OpenClaw · OpenCode · Grok · Codex · Claude Code    —    source: components/ALIGNMENT.md §2, every cell a verbatim copy of that harness's own profile. Absence recorded, never inferred.</text>
</svg>
