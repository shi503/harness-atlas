# Claude Code — spectrum positions and DX scorecard.
#
# schema_version 2 adds the `scorecard:` block, plus the `split:` and `gap:` field
# rules. Nothing was ever written at v1, so v2 is free — see 00-README.md §2.3.
#
# Every `evidence` entry points at a section or component id of the profile named
# below. Never at a URL: the profile already holds the citation.

# ---------------------------------------------------------------- R11 verification
# 01-scorecard.md §1 R11 and §2.3. `verified: false` renders the DRAFTED banner on the
# card in positioning.md. Only a human review pass flips it — not age, not a re-render.
verification:
  derived_from:
    - "vendor documentation — code.claude.com/docs/en/, read 2026-09-04 via the profile"
    - "repo README, release notes and tag history — anthropics/claude-code"
    - "product positioning — claude.com/product/claude-code, quoted verbatim in §7"
  grounded_against:
    - "§4 component matrix — 33 rows, ● 17 · ◐ 14 · ○ 2"
    - "§5 primitives — 8 named units, ⚠️ contestable"
    - "§7 identity table — licence, stars, repo age, tags, install, self-description"
  drafted_by: "claude-opus-5"
  drafted_on: "2026-09-07"
  verified: false
  verified_by: ~
  verified_on: ~
  note: >
    Positioning and observed artifact disagree in two places, and the artifact won both times.
    (1) The repo description and the docs give different self-descriptions; §7 records both and
    rule 5a picks the docs. (2) GitHub's linguist reports Python while the root tree carries no
    application source and the CLI installs as a compiled binary — §7 marks the repo's status
    ⚠️ unverified rather than reading the language field as evidence of openness. Neither
    disagreement moved a DX value; both are recorded because R11 says the disagreement is the
    thing worth keeping, not the resolution.

spectrums:
  schema_version: 2
  harness: claude-code
  profile: content/claude-code.md
  profile_read: "2026-09-04"      # the profile's own read date, not the scoring date
  scored: "2026-09-07"
  scorer: KD

  # ---------------------------------------------------------------- the ten axes
  # All ten are scored, always. `headline` governs display only (01-scorecard.md §3).
  positions:

    - id: operator-scale
      value: 1
      mark: direct
      evidence: ["§7 · serves more than one person", "10b", "10a", "3d", "4b"]
      because: "Managed settings and named org roles are enforced over sessions; no tenancy, scope or room object exists."
      split: "Scored at the org-policy layer, which the profile states verbatim. The session layer alone is −3; §7's altitude is dual and rule 7 says record both."

    - id: state-durability
      value: 0
      mark: direct
      evidence: ["5a", "5b", "7a", "§7 · does state persist"]
      because: "File-backed and machine-local: CLAUDE.md in git, auto memory not shared across machines, TodoWrite session-scoped."

    - id: binding-force
      value: 3
      mark: direct
      evidence: ["2c", "3d", "4b", "§7 · binds mechanically or only by prose"]
      because: "Managed settings and an OS sandbox sit outside the prompt; rules are enforced by Claude Code, not by the model."
      gap: "Whether bypassPermissions defeats the OS sandbox is not in the profile. If it does, the 'no mode bypasses' half of the +3 anchor weakens."

    - id: loop-ownership
      value: 3
      dual: null
      mark: direct
      evidence: ["§7 · loop question", "0a", "2a"]
      because: "Runs the agentic loop itself and ships no adapter into another harness's loop; every surface shares one engine."

    - id: substrate-portability
      value: 0
      mark: direct
      evidence: ["0a", "2a", "3e"]
      because: "Provider swap is configuration across five hosts; the model family is not swappable at all."
      split: "Host portability is +1-ish, model-family portability is −3. Scored 0 on the 0a row, which states both in one sentence."
      gap: "Whether the CLI can run a non-Anthropic model is not stated anywhere in the profile. A yes would move this to +2."

    - id: primitive-discipline
      value: 1
      mark: direct
      evidence: ["§5 count and verdict"]
      because: "Eight named units, one past the healthy band; the vendor publishes no canonical set and no refusal list."
      # `⚠️ contestable` in §5 is a rule-4 count modifier, NOT a source mark, so the
      # "inherit the weakest mark" rule does not fire here. Precedent, 2026-09-07.

    - id: control-posture
      value: 0
      mark: direct
      evidence: ["3a", "2c", "9c", "7a"]
      because: "Deny→ask→allow with a read-only plan mode is the default; unattended modes exist and are opt-in."
      # Axis VII's shape is contested (polar vs centred). On this harness both readings
      # produce 0, so the first scored profile does not settle it. Recorded, untested.

    - id: proof-ceremony
      value: 0
      mark: direct
      evidence: ["8b", "8c", "9d"]
      because: "A named permission-audit event and OTel traces exist; both are opt-in and nothing requires an artifact per unit."

    - id: improvement-loop
      value: 0
      mark: direct
      evidence: ["9a", "9d", "9e", "5c"]
      because: "Auto memory captures corrections per machine; no core pipeline promotes a lesson into a shared reviewed rule."

    - id: cost-visibility
      value: 3
      mark: direct
      evidence: ["8d", "8c", "8b"]
      because: "/usage attributes cost per skill, subagent, plugin and MCP server; OTel spans join spend to the run."

  # --------------------------------------------------- probation axes (00-README §5)
  # Scored so R6 has data. Excluded from the fingerprint until promoted.
  probation:

    - id: surface-breadth
      value: 3
      mark: direct
      evidence: ["11a", "6b"]
      because: "Six first-party surfaces on one engine, with 'the same underlying Claude Code engine' as a stated source of truth."

    - id: routing-determinism
      value: -1
      mark: direct
      evidence: ["3b"]
      because: "Per-role model assignment resolves without the model; which agent handles a message has no resolver at all."
      split: "Model routing is deterministic; agent routing is absent. Scored on the latter, which is the axis's own question."

    - id: knowledge-depth
      value: -1
      mark: direct
      evidence: ["5c"]
      because: "MCP resources and connectors surface external data; nothing curates, retrieves or cites it as knowledge."

  # ------------------------------------------------------- the seven DX dimensions
  # Authored, never computed (01-scorecard.md §1 R8).
  #
  # RE-SCORED 2026-09-07 against the revised seven (ruling `2026-09-07-dx-revision`,
  # 01-scorecard.md §7). Four ids retired and superseded; DX-4's polarity reversed;
  # DX-5 narrowed to adoption. The superseded scoring is kept below the live block.
  scorecard:

    - id: org-scale
      dx: 1
      value: 1
      mark: direct
      supersedes: operator-scale
      reads_opened:
        axes: ["operator-scale: +1"]
        profile: ["§7 Q2", "10b", "10a", "3d", "4b"]
      because: "Pass-through of axis I, and the only one left. Org policy is enforced over sessions — managed settings, Code Review, analytics — but no tenancy, scope or room object exists."
      unchanged_by_revision: true

    - id: weight-class
      dx: 2
      value: 1
      mark: direct
      supersedes: constraint-form
      reads_opened:
        axes: ["proof-ceremony: 0 — direct", "primitive-discipline: +1 — BULK ONLY, verdict discarded"]
        profile: ["§5 · 8 named units", "§1 · Structured output = the claude_code.interaction OTel trace", "§3 · hook lifecycle and subagent/agent-team workflows", "2b · 33 hook events", "2c", "8a", "8b"]
      because: >
        Real machinery, unenforced rigor. Eight named units sits above the 5–7 band, 2b ships 33 hook
        events across 5 handler types, and 6b names four execution environments — that is a
        substantial harness. But nothing requires an artifact per unit: 8a's multi-agent verification
        pipeline is "explicitly non-blocking", 8c's traces are beta and opt-in, and the structured
        output is telemetry rather than a gate. No domain-specific validation standard exists.
      split: >
        R10. Machinery scored at +1; rigor alone is 0 (axis VIII, verbatim: "nothing requires an
        artifact per unit"). Scored on the machinery, which §5's count states most directly.
      note: >
        NOT a re-labelling of the old constraint-form +1. That value answered "prose or machine",
        which is now axis III alone. This value answers "how much harness, and built to produce what".
        The two agreeing at +1 is a coincidence of this harness, not a mapping.

    - id: surfaces-extendability
      dx: 3
      value: 3
      mark: direct
      supersedes: footprint
      reads_opened:
        axes: ["surface-breadth: +3 (probation)"]
        profile: ["11a · six first-party surfaces on one engine", "6b · four execution environments", "6d · CI/CD and Code Review", "8c · telemetry out", "1a", "2b · hooks", "2a · MCP, 4 transports", "4a · Skill + MCP + Plugin bundling"]
      because: >
        A platform on every clause of the +3 anchor. Six surfaces with a stated source of truth —
        "the same underlying Claude Code engine" — four execution environments, published hook, MCP
        and plugin extension points, delivery through GitHub Actions and GitLab CI/CD, and OTel out.
      note: >
        Widened 2026-09-07. Hooks (2b), plugin bundling (4a) and adapters (2a) are now scored here
        rather than under DX-5. The value did not move; the evidence set grew.

    - id: domain-specialization
      dx: 4
      value: 2
      mark: direct
      supersedes: domain-breadth
      reads_opened:
        axes: []
        profile: ["§7 · what it says it is, verbatim", "Genre row (04-harness-alignment §1)", "6d · Code Review", "6c · monorepo config and worktrees", "§5 · no published refusal list"]
      because: >
        Positioned AND built for one domain. It names it in its own first sentence — "an agentic
        coding tool that reads your codebase, edits files, runs commands" — and the machinery is
        code-shaped rather than generic: 6d ships a hosted Code Review service and CI integration,
        6c carries monorepo and worktree handling. Short of +3 because it refuses no adjacent use:
        §5 finds no published refusal list, checked across glossary.md, overview.md and
        how-claude-code-works.md.
      note: >
        POLARITY REVERSED 2026-09-07. This is the same reading as the superseded domain-breadth −2,
        with the sign flipped and the "machinery is domain-shaped" half newly required. A reader
        comparing +2 here against −2 in any pre-revision copy is looking at one observation, not two.

    - id: ecosystem
      dx: 5
      value: 2
      grades: true
      mark: direct
      reads_opened:
        axes: []
        profile: ["§7 Stars 144,088 (2026-09-04)", "§7 Repo created 2025-02-22", "§7 213 tags, latest v2.1.261 published 2026-09-04", "§7 First release ⚠️ unverified", "9e · curated OFFICIAL plugin marketplace"]
      because: >
        Wide adoption and longevity are both met — 144,088 stars, 18 months of repo history, 213 tags
        with a release published on the read date itself. The third clause of +3 is not: the profile
        records no count of third-party authors, plugins or marketplace entries, and 9e's marketplace
        is described as "curated official". Stars measure attention, not building.
      gap: >
        No third-party author, plugin or marketplace-entry count appears anywhere in the profile or
        its 12-document deep read. A count is the single fact that would settle +2 against +3.
      note: >
        MOVED BY THE REVISION, not by new evidence. The superseded ecosystem +3 rested substantially
        on "marketplaces with SHA pinning, a co-published open standard, MCP" — all of which are now
        DX-3 (01-scorecard.md §4, the DX-3 boundary note). Under anchors narrowed to adoption alone,
        the same profile reads +2. This is the revision's one score change, and it is the intended
        consequence of removing the DX-3/DX-5 evidence collision.

    - id: ownership
      dx: 6
      value: -3
      mark: direct
      reads_opened:
        axes: ["substrate-portability: 0"]
        profile: ["§7 License — no OSS licence, LICENSE.md 'All rights reserved', license: null", "§7 Install — compiled binary", "0a", "6b"]
      because: "No OSS licence, a compiled binary, one vendor's model family. All three anchors of −3 are met."
      split: >
        Where it runs is portable — five providers, self-hosted environments, devcontainers. What runs
        is not ownable. Scored on the licence, which §7 states verbatim.
      unchanged_by_revision: true

    - id: cost-controls
      dx: 7
      value: 3
      mark: direct
      supersedes: cost-visibility
      reads_opened:
        axes: ["cost-visibility: +3 — the observability third", "routing-determinism: −1 (probation) — the routing third"]
        profile: ["8d · /usage, prompt-cache stats, modelPricing, spend limits, effort levels", "8c · OTel metrics/events + beta traces", "8b", "3b · per-role model assignment + availableModels substitution"]
      because: >
        All three thirds shipped, and 8d carries them in one row. Observability: /usage attributes
        cost per skill, subagent, plugin and MCP server, and OTel spans join spend to the run.
        Efficiency: prompt-cache stats and effort levels. Control: enforced spend limits, plus
        per-role model assignment and modelPricing as model measurement and routing.
      note: >
        NO LONGER A PASS-THROUGH. Axis X supplies the observability third only; the efficiency and
        control thirds are read from 8d and 3b. Scored +3 on the cost sense of routing — per-role
        model assignment is model routing — even though routing-determinism scores −1, which is about
        message-to-agent resolution and is a different question. Recorded so the −1 is not read as
        contradicting this cell.

  # ---------------------------------------------- superseded scoring, 2026-09-07 (kept, not deleted)
  # The seven as scored against the ORIGINAL dimensions earlier the same day, before KD's
  # revision. Kept under the standing rule that a vocabulary retires by ruling, never by
  # deletion. Do not render these; they answer questions the sheet no longer asks.
  superseded_scorecard:
    revision: "2026-09-07-dx-revision"
    fingerprint: "+1 · +1 · +3 · −2 · +3† · −3 · +3"
    values:
      operator-scale:   {dx: 1, value: 1,  now: "org-scale +1 — unchanged"}
      constraint-form:  {dx: 2, value: 1,  now: "weight-class +1 — same number, different question"}
      footprint:        {dx: 3, value: 3,  now: "surfaces-extendability +3 — unchanged, evidence set grew"}
      domain-breadth:   {dx: 4, value: -2, now: "domain-specialization +2 — POLARITY REVERSED"}
      ecosystem:        {dx: 5, value: 3,  now: "ecosystem +2 — MOVED by the narrowing to adoption only"}
      ownership:        {dx: 6, value: -3, now: "ownership −3 — unchanged"}
      cost-visibility:  {dx: 7, value: 3,  now: "cost-controls +3 — unchanged, dimension widened"}
